name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Validate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Schema-validate every rule
        run: dac validate
      - name: Rule inventory
        run: |
          echo '### Rule inventory' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          dac rules >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint and SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github src tests
      - name: ruff format
        run: ruff format --check src tests
      - name: bandit
        run: bandit -q -c pyproject.toml -r src

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run the detection corpus
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  scan-demo:
    name: Scan the fixture corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Scan every fixture and publish the report
        run: |
          {
            echo '## Detection scan of the fixture corpus'
            for parser in sshd dnsmasq weblog; do
              for log in tests/fixtures/"$parser"/*.log; do
                [ -e "$log" ] || continue
                echo "### \`$log\`"
                dac scan "$log" -p "$parser" -f markdown
                echo
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Real captured traffic must produce zero alerts
        run: |
          dac scan tests/fixtures/weblog/webui-benign-real.log -p weblog \
            --fail-on informational
