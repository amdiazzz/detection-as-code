title: SSH Password Brute Force
id: dab16131-ad8e-453e-9572-a0cda34e3a61
status: experimental
description: |
  Five or more failed SSH password authentications from one source address
  within five minutes. Grouping on src_ip alone (rather than src_ip plus user)
  is deliberate: credential stuffing rotates the username on every attempt, so
  grouping by user would split a single attack across buckets and never reach
  the threshold.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Alex Diaz
date: 2026/11/14
modified: 2026/11/14
tags:
  - attack.credential_access
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - c314784d-cd7c-4fe4-9a1f-fcd0470d1cde
  group-by:
    - src_ip
  timespan: 5m
  condition:
    gte: 5
falsepositives:
  - A misconfigured backup or monitoring client retrying stale credentials
  - A user iterating through saved passwords after a password change
level: high
