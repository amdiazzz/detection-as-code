title: SSH Password Authentication Failure
id: c314784d-cd7c-4fe4-9a1f-fcd0470d1cde
status: experimental
description: |
  A single failed SSH password authentication. On an internet-facing host this
  fires constantly, so it is deliberately level=informational and exists as a
  building block for the brute-force correlation rule rather than as an alert
  in its own right.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Alex Diaz
date: 2026/11/14
modified: 2026/11/14
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    auth_result: failure
    auth_method: password
  condition: selection
fields:
  - src_ip
  - user
  - invalid_user
falsepositives:
  - A legitimate user mistyping their password
  - Stale credentials in an automation job or backup client
level: informational
