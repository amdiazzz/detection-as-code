rule: detections/linux/sshd_failed_password.yml
parser: sshd
true_positives:
  - name: failed password for a valid user
    line: "Nov 14 03:11:11 cs101 sshd[2211]: Failed password for root from 203.0.113.37 port 51200 ssh2"
  - name: failed password for a nonexistent user
    line: "Nov 14 03:11:31 cs101 sshd[2212]: Failed password for invalid user oracle from 203.0.113.37 port 51201 ssh2"
  - name: failure from inside the LAN still matches the building block
    line: "Nov 14 06:04:40 cs101 sshd[5510]: Failed password for alexdiaz from 10.0.1.26 port 49611 ssh2"
true_negatives:
  - name: successful password login is not a failure
    line: "Nov 14 06:04:48 cs101 sshd[5510]: Accepted password for alexdiaz from 10.0.1.26 port 49611 ssh2"
  - name: publickey failure is a different auth method
    line: "Nov 14 03:20:00 cs101 sshd[2250]: Failed publickey for root from 203.0.113.37 port 51300 ssh2"
  - name: an invalid-user notice carries no auth_method
    line: "Nov 14 03:11:12 cs101 sshd[2212]: Invalid user oracle from 203.0.113.37 port 51201"
  - name: a non-sshd syslog line is ignored entirely
    line: "Nov 14 06:12:33 cs101 systemd[1]: Started Session 42 of User alexdiaz."
