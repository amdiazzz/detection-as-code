rule: correlations/sshd_password_bruteforce.yml
parser: sshd
supporting_rules:
  - detections/linux/sshd_failed_password.yml
scenarios:
  - name: six failures from one source inside five minutes fires once
    fixture: sshd/bruteforce-single-source.log
    expect_alerts: 1
  - name: three failures stay below the threshold
    fixture: sshd/bruteforce-below-threshold.log
    expect_alerts: 0
  - name: six failures spread over 35 minutes never fill the window
    fixture: sshd/bruteforce-slow-outside-window.log
    expect_alerts: 0
  - name: normal admin activity with one typo stays quiet
    fixture: sshd/benign-admin-activity.log
    expect_alerts: 0
  - name: corrupt timestamps are skipped rather than crashing the scan
    fixture: sshd/malformed-timestamps.log
    expect_alerts: 0
